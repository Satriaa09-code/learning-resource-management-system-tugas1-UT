<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SITTA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-page">  
         <div class="opening-container">
            <h1>Selamat Datang di My SITTA</h1>
            <p>Silahkan daftar terlebih dulu jika kamu belum punya akun</p>
            <button id="btnDaftar" class="btn-daftar">Daftar</button>
        </div>

        <div class="login-container">
            <h2>Masuk</h2>
            <p>Atau gunakan akunmu untuk masuk</p>
            <form action="" id="login">
                <input type="text" placeholder="Email">
                <input type="password" placeholder="Password">
                <a href="#">Lupa Password?</a>
                <input type="submit">    
            </form>
        </div>
   </div>

   <div class="form-list-container">
        <h2>Formulir <br> Pendaftaran</h2>
        <form action="" id="formList">
            <label for="nama">Nama</label><input type="text" required>
            <label for="katasandi">Kata sandi</label> <input type="password" required>
            <input type="submit" value="Kirim">
        </form>
   </div>

</body>
</html>
